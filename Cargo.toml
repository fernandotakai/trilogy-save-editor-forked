[package]
name = "trilogy-save-editor"
version = "2.2.1"
authors = ["Karlitos"]
license = "CECILL-2.1"
edition = "2021"
description = "Terminal editor for Mass Effect Legendary Edition PC saves"

[profile.release]
lto = true

[workspace]
members = ["macros"]

[dependencies]
macros = { path = "macros" }
anyhow = "1.0"
derive_more = { version = "0.99", features = [
    "deref",
    "deref_mut",
    "display",
    "from",
], default-features = false }
bitvec = { version = "1.0", features = ["std"], default-features = false }
indexmap = { version = "2", features = ["serde"] }
encoding_rs = "0.8"
crc = "2.0"
flate2 = { version = "1.0", features = ["rust_backend"], default-features = false }
zip = { version = "0.5", features = ["deflate"], default-features = false }
uuid = "0.8"
serde = { version = "1.0", features = ["derive"] }
ron = "0.7"
ratatui = "0.29"
